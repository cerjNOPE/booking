version: '3.8'

services:
  db:
    image: postgres:16
    container_name: booking_db
    environment:
      POSTGRES_DB: Booking
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: q-123456
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d Booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
